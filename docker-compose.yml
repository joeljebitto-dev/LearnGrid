x-backend-common: &backend-common
   command: >
     sh -c "python manage.py migrate --noinput &&
     gunicorn config.wsgi:application --bind 0.0.0.0:8000
     --workers 2
     --timeout 60
     --access-logfile - --error-logfile -"
   environment: &backend-environment
     DJANGO_SETTINGS_MODULE: config.settings.local
     DJANGO_DEBUG: "true"
     DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-django-secret-key-for-learngrid-dev}
     DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api-gateway,auth-service,user-service,course-service,content-service,enrollment-service,progress-service,assessment-service,grading-service,notification-service,analytics-service
     CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://localhost:8443,https://127.0.0.1:8443
     CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://localhost:8443,https://127.0.0.1:8443
     PORT: "8000"
     GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
     GUNICORN_TIMEOUT_SECONDS: ${GUNICORN_TIMEOUT_SECONDS:-60}
     REDIS_URL: redis://redis:6379/0
     REDIS_ENV: local
     AUTH_SERVICE_BASE_URL: http://auth-service:8000
     USER_SERVICE_BASE_URL: http://user-service:8000
     COURSE_SERVICE_BASE_URL: http://course-service:8000
     CONTENT_SERVICE_BASE_URL: http://content-service:8000
     ENROLLMENT_SERVICE_BASE_URL: http://enrollment-service:8000
     PROGRESS_SERVICE_BASE_URL: http://progress-service:8000
     ASSESSMENT_SERVICE_BASE_URL: http://assessment-service:8000
     CONTENT_STORAGE_PROVIDER: minio
     CONTENT_STORAGE_BUCKET: ${CONTENT_STORAGE_BUCKET:-learngrid-content}
     CONTENT_MINIO_ENDPOINT_URL: http://minio:9000
     CONTENT_MINIO_ACCESS_KEY: ${CONTENT_MINIO_ACCESS_KEY:-learngrid}
     CONTENT_MINIO_SECRET_KEY: ${CONTENT_MINIO_SECRET_KEY:-compose-minio-root-password}
     CONTENT_MINIO_SECURE: "false"
     AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:-compose-auth-jwt-signing-key-for-learngrid-dev}
     AUTH_TOKEN_HASH_KEY: ${AUTH_TOKEN_HASH_KEY:-compose-auth-token-hash-key-for-learngrid-dev}
     AUTH_JWT_ISSUER: learngrid-auth-service
     AUTH_JWT_ALGORITHM: HS256
     KAFKA_ENABLED: "true"
     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
     KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
     KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
     KAFKA_MAX_RETRY_ATTEMPTS: ${KAFKA_MAX_RETRY_ATTEMPTS:-3}
   depends_on: &backend-depends-on
     postgres:
       condition: service_healthy
     postgres-init:
       condition: service_completed_successfully
     redis:
       condition: service_healthy
     minio-init:
       condition: service_completed_successfully
     kafka:
       condition: service_healthy
     kafka-init:
       condition: service_completed_successfully
   volumes:
     - ./scripts:/app/scripts:ro
   healthcheck: &backend-healthcheck
     test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ >/dev/null || exit 1"]
     interval: 10s
     timeout: 5s
     retries: 12
     start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    container_name: learngrid-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learngrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learngrid}
      POSTGRES_DB: learngrid
    ports:
      - "5432:5432"
    volumes:
      - learngrid_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learngrid} -d learngrid"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    container_name: learngrid-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learngrid}
      PGPASSWORD: ${POSTGRES_PASSWORD:-learngrid}
    entrypoint: >
      /bin/sh -c '
      set -e;
      for database_name in auth_db user_db course_db content_db enrollment_db progress_db assessment_db grading_db notification_db analytics_db; do
        if ! psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '\''$$database_name'\'';" | grep -q 1; then
          createdb -h postgres -U "$$POSTGRES_USER" "$$database_name";
        fi;
      done
      '

  redis:
    image: redis:7-alpine
    container_name: learngrid-redis
    ports:
      - "6379:6379"
    volumes:
      - learngrid_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: learngrid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-learngrid}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-compose-minio-root-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - learngrid_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: learngrid-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-learngrid} ${MINIO_ROOT_PASSWORD:-compose-minio-root-password};
      mc mb -p local/${CONTENT_STORAGE_BUCKET:-learngrid-content} || true;
      mc anonymous set none local/${CONTENT_STORAGE_BUCKET:-learngrid-content} || true;
      "

  kafka:
    image: apache/kafka:3.8.1
    container_name: learngrid-kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
    volumes:
      - learngrid_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: learngrid-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    command: >
      /bin/sh -c '
      topics="user.events course.events enrollment.events content.events progress.events assessment.events grading.events notification.events audit.events analytics.events";
      for topic in $$topics; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_DEFAULT_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic.retry" --partitions "$$KAFKA_DEFAULT_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic.dlq" --partitions "$$KAFKA_DEFAULT_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR";
      done
      '

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: learngrid-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: learngrid-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  auth-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: learngrid-auth-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/auth_db
    ports:
      - "8001:8000"

  user-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/user-service/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: learngrid-user-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/user_db
    ports:
      - "8002:8000"

  course-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/course-service/Dockerfile
      args:
        SERVICE_NAME: course-service
    container_name: learngrid-course-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/course_db
    ports:
      - "8003:8000"

  content-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/content-service/Dockerfile
      args:
        SERVICE_NAME: content-service
    container_name: learngrid-content-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/content_db
    ports:
      - "8004:8000"

  enrollment-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/enrollment-service/Dockerfile
      args:
        SERVICE_NAME: enrollment-service
    container_name: learngrid-enrollment-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/enrollment_db
    ports:
      - "8005:8000"

  progress-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/progress-service/Dockerfile
      args:
        SERVICE_NAME: progress-service
    container_name: learngrid-progress-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/progress_db
    ports:
      - "8006:8000"

  assessment-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/assessment-service/Dockerfile
      args:
        SERVICE_NAME: assessment-service
    container_name: learngrid-assessment-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/assessment_db
    ports:
      - "8007:8000"

  grading-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/grading-service/Dockerfile
      args:
        SERVICE_NAME: grading-service
    container_name: learngrid-grading-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/grading_db
    ports:
      - "8008:8000"

  notification-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: learngrid-notification-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/notification_db
    ports:
      - "8009:8000"

  analytics-service:
    <<: *backend-common
    build:
      context: .
      dockerfile: backend/services/analytics-service/Dockerfile
      args:
        SERVICE_NAME: analytics-service
    container_name: learngrid-analytics-service
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://learngrid:learngrid@postgres:5432/analytics_db
    ports:
      - "8010:8000"

  frontend-service:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: learngrid-frontend-service
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-gateway:
    image: nginx:1.27-alpine
    container_name: learngrid-api-gateway
    depends_on:
      frontend-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      progress-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      grading-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.compose.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1:8443/gateway/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  learngrid_postgres_data:
  learngrid_redis_data:
  learngrid_minio_data:
  learngrid_kafka_data:
